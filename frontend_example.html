<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buy Product – ₹200</title>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Razorpay Checkout -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; }
    #loginBtn  { background: #4285F4; color: white; }
    #buyBtn    { background: #2BB5A0; color: white; display: none; }
    #status    { margin-top: 16px; color: #555; }
  </style>
</head>
<body>
  <h2>My Awesome Product – ₹200</h2>
  <p>Sign in with Google, then purchase instant access.</p>

  <button id="loginBtn" onclick="loginWithGoogle()">Sign in with Google</button>
  <button id="buyBtn"   onclick="buyProduct()">Buy Now – ₹200</button>
  <p id="status"></p>

  <script>
    const SUPABASE_URL   = 'https://your-project.supabase.co';
    const SUPABASE_ANON  = 'your-anon-key';
    const API_BASE       = 'http://localhost:8000';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    let accessToken = null;

    // ── Auth ─────────────────────────────────────────────────────────────────
    async function loginWithGoogle() {
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href }
      });
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        accessToken = session.access_token;
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('buyBtn').style.display   = 'inline-block';
        document.getElementById('status').textContent =
          `Logged in as ${session.user.email}`;
        checkAccess();
      }
    }

    async function checkAccess() {
      const res  = await fetch(`${API_BASE}/payments/status`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const data = await res.json();
      if (data.has_access) {
        document.getElementById('buyBtn').style.display = 'none';
        document.getElementById('status').textContent =
          `✅ You already have access! Granted at ${data.granted_at}`;
      }
    }

    // ── Payment ──────────────────────────────────────────────────────────────
    async function buyProduct() {
      document.getElementById('status').textContent = 'Creating order…';

      // 1. Create order on backend
      const orderRes = await fetch(`${API_BASE}/payments/create-order`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const order = await orderRes.json();

      if (!orderRes.ok) {
        document.getElementById('status').textContent = order.detail;
        return;
      }

      // 2. Open Razorpay Checkout
      const rzp = new Razorpay({
        key:         order.razorpay_key_id,
        amount:      order.amount,
        currency:    order.currency,
        name:        order.product_name,
        order_id:    order.order_id,
        prefill: {
          email: (await sb.auth.getUser()).data.user?.email
        },
        handler: async (response) => {
          // 3. Verify on backend
          const verifyRes = await fetch(`${API_BASE}/payments/verify`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${accessToken}`
            },
            body: JSON.stringify({
              razorpay_order_id:   response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature:  response.razorpay_signature,
            })
          });
          const result = await verifyRes.json();
          document.getElementById('status').textContent = result.message;
          document.getElementById('buyBtn').style.display = 'none';
        },
        modal: {
          ondismiss: () => {
            document.getElementById('status').textContent = 'Payment cancelled.';
          }
        }
      });
      rzp.open();
    }

    init();
  </script>
</body>
</html>
